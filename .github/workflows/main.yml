name: Main

on:
  push:
    branches: [master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      home: ${{ steps.filter.outputs.home }}
      blog: ${{ steps.filter.outputs.blog }}
      task_manager: ${{ steps.filter.outputs.task_manager }}
      personal_assistant: ${{ steps.filter.outputs.personal_assistant }}
      kstatus: ${{ steps.filter.outputs.kstatus }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            shared: &shared
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
            home: [*shared, 'apps/home/**']
            blog: [*shared, 'apps/blog/**']
            # '.dockerignore' shapes the build context both Dockerfiles below share; the release
            # workflow file itself is included too, so editing the deploy pipeline (e.g. bumping
            # a pinned action, changing the image tag) re-runs it just like an app code change
            # would, instead of silently going untested until the next unrelated release.
            task_manager: [*shared, 'apps/task-manager/**', '.dockerignore', '.github/workflows/release_task_manager.yml']
            personal_assistant: [*shared, 'apps/personal-assistant/**', '.dockerignore', '.github/workflows/release_personal_assistant.yml']
            kstatus: [*shared, 'apps/kstatus/**', '.dockerignore', '.github/workflows/release_kstatus.yml']

  release_home:
    needs: changes
    if: needs.changes.outputs.home == 'true'
    uses: ./.github/workflows/release_homepage.yml
    with:
      ref: ${{ github.ref }}
    secrets:
      DOKKU_DEPLOY_KEY: ${{ secrets.DOKKU_DEPLOY_KEY }}

  release_blog:
    needs: changes
    if: needs.changes.outputs.blog == 'true'
    uses: ./.github/workflows/release_blog.yml
    with:
      ref: ${{ github.ref }}
    secrets:
      DOKKU_DEPLOY_KEY: ${{ secrets.DOKKU_DEPLOY_KEY }}

  release_task_manager:
    needs: changes
    if: needs.changes.outputs.task_manager == 'true'
    uses: ./.github/workflows/release_task_manager.yml
    with:
      ref: ${{ github.ref }}
    secrets:
      DOKKU_DEPLOY_KEY: ${{ secrets.DOKKU_DEPLOY_KEY }}

  release_personal_assistant:
    needs: changes
    if: needs.changes.outputs.personal_assistant == 'true'
    uses: ./.github/workflows/release_personal_assistant.yml
    with:
      ref: ${{ github.ref }}
    secrets:
      DOKKU_DEPLOY_KEY: ${{ secrets.DOKKU_DEPLOY_KEY }}

  release_kstatus:
    needs: changes
    if: needs.changes.outputs.kstatus == 'true'
    uses: ./.github/workflows/release_kstatus.yml
    with:
      ref: ${{ github.ref }}
    secrets:
      DOKKU_DEPLOY_KEY: ${{ secrets.DOKKU_DEPLOY_KEY }}
