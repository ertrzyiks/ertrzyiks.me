name: Terraform Apply

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
    secrets:
      TF_API_TOKEN:
        required: true
      DOKKU_DEPLOY_KEY:
        required: true
      OP_SERVICE_ACCOUNT_TOKEN:
        required: true
      CHECKLY_API_TOKEN:
        required: true
      CHECKLY_ACCOUNT_ID:
        required: true

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      TF_VAR_checkly_api_key: ${{ secrets.CHECKLY_API_TOKEN }}
      TF_VAR_checkly_account_id: ${{ secrets.CHECKLY_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Install 1Password CLI
        uses: 1password/install-cli-action@v4.1.0

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DOKKU_DEPLOY_KEY }}" > ~/.ssh/dokku_deploy_key
          chmod 600 ~/.ssh/dokku_deploy_key
          {
            echo "TF_VAR_dokku_ssh_cert<<EOF"
            cat ~/.ssh/dokku_deploy_key
            echo "EOF"
          } >> $GITHUB_ENV

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve
