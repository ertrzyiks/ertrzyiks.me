name: Preview Home

on:
  pull_request:
    types: [labeled, synchronize]

concurrency:
  group: home-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Home
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'preview') ||
        (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 8.15.9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v6.1.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build
        working-directory: ./apps/home

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: home-dist
          path: apps/home/dist
          retention-days: 1

  deploy_preview:
    name: Deploy Home Preview
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      # Only checked out for apps/home/wrangler.jsonc — deliberately no
      # pnpm install here: this job otherwise only ever sees the built `dist`
      # artifact from the `build` job, never our pnpm-managed node_modules or
      # lockfile — wrangler-action's own installer previously failed with
      # EBADPLATFORM (@rollup/rollup-linux-arm64-gnu on a linux x64 runner)
      # when it ran in a working directory that also held our
      # pnpm-created node_modules.
      - uses: actions/checkout@v7.0.1

      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: home-dist
          path: apps/home/dist

      # `versions upload` only reads whether preview URLs are enabled for
      # this Worker (a GET against .../subdomain) — it never turns that
      # setting on. workers_dev/preview_urls in wrangler.jsonc only take
      # effect once synced server-side, which `triggers deploy` does without
      # touching which version serves production traffic (unlike `versions
      # deploy`). Without this, `versions upload` silently omits preview_url
      # and the PR comment below ends up with an empty URL.
      - name: Sync Worker triggers (enables preview URLs)
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/home
          command: triggers deploy

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/home
          command: versions upload

      - name: Comment preview URL on PR
        uses: actions/github-script@v9.0.0
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const marker = '<!-- home-preview-comment -->'
            const body = `${marker}\n🔍 Preview deployed: ${process.env.PREVIEW_URL}`

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const existing = comments.find(c => c.body.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
